<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rev It</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-content: center; text-align: center;
         background: #111; color: #eee; font-family: system-ui, sans-serif; }
  #rpm { font-size: 96px; font-variant-numeric: tabular-nums; }
  #bar { position: relative; width: 60vw; height: 20px; background: #333; border-radius: 10px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #4c4, #ec4 70%, #e44) 0 0 / 60vw 100%; }
  #engines span { display: inline-block; margin: 4px; padding: 6px 10px; border: 1px solid #444;
                  border-radius: 6px; cursor: pointer; }
  #engines span.on { border-color: #ec4; color: #ec4; }
  small { color: #777; }
  #ignition { width: 170px; margin: 8px auto 0; cursor: pointer; }
  #ignition text { font: bold 10px system-ui, sans-serif; fill: #666; text-anchor: middle; }
  #key { transform-origin: 65px 70px; transform: rotate(-35deg); transition: transform 0.2s; }
  #ignition[data-state="running"] #key { transform: rotate(35deg); }
  #ignition[data-state="cranking"] #key { transform: rotate(90deg); }
  #ignition[data-state="off"] .off, #ignition[data-state="running"] .on,
  #ignition[data-state="cranking"] .start { fill: #ec4; }
  #hud { position: fixed; top: 16px; right: 16px; text-align: right; }
  #game-toggle { display: inline-block; padding: 6px 10px; border: 1px solid #444; border-radius: 6px;
                 cursor: pointer; color: #777; }
  #game-toggle .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #444; }
  .game #game-toggle { border-color: #ec4; color: #ec4; }
  .game #game-toggle .dot { background: #4c4; }
  #score { margin-top: 8px; white-space: pre-line; font-variant-numeric: tabular-nums; color: #777; }
  #score::first-line { font-size: 28px; font-weight: bold; }
  .game #score { color: #eee; }
  #pedals { position: fixed; right: 30px; bottom: 30px; display: flex; gap: 14px; align-items: flex-end; }
  .pedal { width: 64px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
           transform-origin: 50% 100%; transform: perspective(300px) rotateX(0deg);
           transition: transform var(--out) linear; }
  .pedal.down { transform: perspective(300px) rotateX(35deg); transition-duration: var(--in); }
  .pedal.down .pad { fill: #4a4a4a; }
  #gas { --in: 0.4s; --out: 0.25s; width: 56px; }  /* PEDAL_IN / PEDAL_OUT */
  #clutch { --in: 0.12s; --out: 0.6s; }             /* CAR.clutchIn / clutchOut */
  #brake { --in: 0.1s; --out: 0.1s; width: 76px; }
  #drive { margin-top: 10px; color: #aaa; font-variant-numeric: tabular-nums; }
  #drive b { color: #eee; font-size: 22px; }
  #drive button { background: #222; color: #ccc; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  #target { position: absolute; top: 0; bottom: 0; display: none; box-sizing: border-box;
            border: 2px solid #eee; border-radius: 4px; background: #fff3; }
  .game #target { display: block; }
  .hit #target { border-color: #4c4; background: #4c46; }
  .hit #rpm { color: #4c4; }
  #gauge { position: relative; }
  #flash { position: absolute; left: 50%; top: 0; opacity: 0; pointer-events: none; white-space: nowrap;
           font-size: 30px; font-weight: bold; text-shadow: 0 0 10px #000; }
  #pips { display: none; justify-content: center; align-items: center; gap: 6px; margin-top: 10px;
          font-size: 11px; color: #777; }
  .game #pips { display: flex; }
  #pips i { width: 26px; height: 8px; border-radius: 4px; /* --f: how full, --c: fill colour */
            background: linear-gradient(90deg, var(--c, #ec4) var(--f, 0%), #333 0); }
</style>
</head>
<body>
  <div id="hud">
    <div id="game-toggle"><span class="dot"></span> GAME</div>
    <div id="score"></div>
  </div>
  <div id="engines"></div>
  <svg id="ignition" data-state="off" viewBox="0 0 150 110"><title>click to start / stop</title>
    <text class="off" x="33" y="27">OFF</text>
    <text class="on" x="97" y="27">ON</text>
    <text class="start" x="125" y="74">START</text>
    <circle cx="65" cy="70" r="18" fill="#222" stroke="#555" stroke-width="2"/>
    <g id="key">
      <rect x="61" y="56" width="8" height="14" fill="#999"/>
      <rect x="53" y="28" width="24" height="30" rx="9" fill="#bbb"/>
      <circle cx="65" cy="38" r="4" fill="#111"/>
    </g>
  </svg>
  <div id="gauge"><div id="rpm">0</div><div id="flash"></div></div>
  <div id="bar"><div id="fill"></div><div id="target"></div></div>
  <div id="pips"><span id="lvl">LEVEL</span></div>
  <div id="drive"><button id="gear-down">▼</button> gear <b id="gear">N</b> <button id="gear-up">▲</button> · <b id="speed">0</b> km/h</div>
  <p><b>1–3</b> pick engine · <b>ENTER</b> start · hold <b>SPACE</b> or the pedal to rev · <b>ESC</b> stop · <b>G</b> game<br><b>SHIFT</b> clutch · <b>B</b> brake · <b>↑ ↓</b> gears (clutch down)</p>
  <div id="pedals">
  <svg id="clutch" class="pedal" viewBox="0 0 80 140" aria-label="clutch pedal">
    <rect class="pad" x="4" y="4" width="72" height="118" rx="12" fill="#333" stroke="#777" stroke-width="2"/>
    <g stroke="#555" stroke-width="4" stroke-linecap="round">
      <line x1="18" y1="22" x2="62" y2="22"/><line x1="18" y1="36" x2="62" y2="36"/>
      <line x1="18" y1="50" x2="62" y2="50"/><line x1="18" y1="64" x2="62" y2="64"/>
      <line x1="18" y1="78" x2="62" y2="78"/><line x1="18" y1="92" x2="62" y2="92"/>
      <line x1="18" y1="106" x2="62" y2="106"/>
    </g>
    <rect x="26" y="124" width="28" height="12" rx="3" fill="#555"/>
  </svg>
  <svg id="brake" class="pedal" viewBox="0 0 80 140" aria-label="brake pedal">
    <rect class="pad" x="4" y="4" width="72" height="118" rx="12" fill="#333" stroke="#777" stroke-width="2"/>
    <g stroke="#555" stroke-width="4" stroke-linecap="round">
      <line x1="18" y1="22" x2="62" y2="22"/><line x1="18" y1="36" x2="62" y2="36"/>
      <line x1="18" y1="50" x2="62" y2="50"/><line x1="18" y1="64" x2="62" y2="64"/>
      <line x1="18" y1="78" x2="62" y2="78"/><line x1="18" y1="92" x2="62" y2="92"/>
      <line x1="18" y1="106" x2="62" y2="106"/>
    </g>
    <rect x="26" y="124" width="28" height="12" rx="3" fill="#555"/>
  </svg>
  <svg id="gas" class="pedal" viewBox="0 0 80 140" aria-label="gas pedal">
    <rect class="pad" x="4" y="4" width="72" height="118" rx="12" fill="#333" stroke="#777" stroke-width="2"/>
    <g stroke="#555" stroke-width="4" stroke-linecap="round">
      <line x1="18" y1="22" x2="62" y2="22"/><line x1="18" y1="36" x2="62" y2="36"/>
      <line x1="18" y1="50" x2="62" y2="50"/><line x1="18" y1="64" x2="62" y2="64"/>
      <line x1="18" y1="78" x2="62" y2="78"/><line x1="18" y1="92" x2="62" y2="92"/>
      <line x1="18" y1="106" x2="62" y2="106"/>
    </g>
    <rect x="26" y="124" width="28" height="12" rx="3" fill="#555"/>
  </svg>
  </div>
  <small>Recordings from Freesound: Ears68, Angel_soto, editboy23, dezoris, t33kno (CC0), iainmccurdy (CC BY 4.0)</small>
<script src="sounds.js"></script>
<script src="engine.js"></script>
<script src="car.js"></script>
<script src="game.js"></script>
<script src="main.js"></script>
</body>
</html>
